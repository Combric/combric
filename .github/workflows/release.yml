name: Stable Release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit approved for release
        required: true
        type: string
      publish_approval:
        description: Type PUBLISH APPROVED after Product Owner authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and prepare every artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      PUBLISH_APPROVAL: ${{ inputs.publish_approval }}
    steps:
      - name: Validate manual authorization inputs
        shell: bash
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT ?? "")) throw new Error("release_commit must be a lowercase 40-character SHA"); if (process.env.PUBLISH_APPROVAL !== "PUBLISH APPROVED") throw new Error("Missing exact Product Owner publication approval")'

      - name: Check out exact approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository, main, commit, and tag state
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "Combric/combric"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0; then
            echo "v1.0.0 already exists" >&2
            exit 1
          fi
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v1.0.0 already exists" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run canonical and release-candidate validation
        run: pnpm validate

      - name: Validate and build documentation
        run: pnpm docs:check && pnpm docs:build && pnpm docs:validate

      - name: Install Chromium
        run:
          pnpm --filter @combric/docs exec playwright install --with-deps
          chromium

      - name: Run browser and accessibility gates
        run: pnpm docs:test

      - name: Confirm every target version is absent from npm
        run: pnpm release:check-registry

      - name: Pack and hash the release artifacts
        run: pnpm release:artifacts --output release-artifacts

      - name: Upload the verified release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combric-v1.0.0
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts with npm OIDC
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm with Trusted Publishing support
        shell: bash
        run: |
          npm --version
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1 or newer is required for Trusted Publishing")' "$(npm --version)"

      - name: Frozen install for publication tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the verified release set
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: combric-v1.0.0
          path: release-artifacts

      - name: Reconfirm target versions are absent
        run: pnpm release:check-registry

      - name: Publish in dependency-safe order
        run: node scripts/publish-release.mjs release-artifacts

  finalize:
    name: Verify npm and create repository release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: v1.0.0
    steps:
      - name: Check out exact published commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify every package is public at 1.0.0
        run: node scripts/verify-npm-publication.mjs

      - name: Create the single repository tag and GitHub Release
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Combric 1.0.0"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "Combric 1.0.0" --notes-file CHANGELOG.md

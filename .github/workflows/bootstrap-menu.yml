name: Bootstrap Menu Package

# One-time registry namespace bootstrap for the new @combric/menu package.
# NPM_BOOTSTRAP_TOKEN is limited to the protected npm-bootstrap environment and
# is never used by the OIDC-based Combric Release workflow.

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit containing @combric/menu
        required: true
        type: string
      bootstrap_approval:
        description: Type BOOTSTRAP APPROVED after Product Owner authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-menu
  cancel-in-progress: false

env:
  RELEASE_COMMIT: ${{ inputs.release_commit }}
  BOOTSTRAP_APPROVAL: ${{ inputs.bootstrap_approval }}
  BOOTSTRAP_VERSION: 0.0.0-bootstrap.0

jobs:
  bootstrap:
    name: Publish @combric/menu bootstrap package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-bootstrap

    steps:
      - name: Validate manual authorization inputs
        shell: bash
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT ?? "")) throw new Error("release_commit must be a lowercase 40-character SHA"); if (process.env.BOOTSTRAP_APPROVAL !== "BOOTSTRAP APPROVED") throw new Error("Missing exact bootstrap authorization")'

      - name: Check out exact approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository, main, and approved commit
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "Combric/combric"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Confirm bootstrap version is absent
        shell: bash
        run: |
          if npm view "@combric/menu@$BOOTSTRAP_VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@combric/menu@$BOOTSTRAP_VERSION already exists" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate Menu
        run: pnpm build && pnpm test:menu:packed && pnpm validate:menu:budget

      - name: Prepare bootstrap tarball
        run: node scripts/bootstrap-menu.mjs --output .cache/menu-bootstrap

      - name: Publish bootstrap package
        run: >-
          npm publish
          ".cache/menu-bootstrap/combric-menu-${BOOTSTRAP_VERSION}.tgz" --access
          public --tag bootstrap --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Verify bootstrap package visibility
        shell: bash
        run: |
          for attempt in {1..30}; do
            if node -e 'const version=process.argv[1]; const response=await fetch(`https://registry.npmjs.org/${encodeURIComponent("@combric/menu")}`,{headers:{accept:"application/json"}}); if (!response.ok) process.exit(1); const metadata=await response.json(); if (metadata.versions?.[version]?.version !== version || metadata["dist-tags"]?.bootstrap !== version) process.exit(1);' "$BOOTSTRAP_VERSION"; then
              echo "@combric/menu@$BOOTSTRAP_VERSION is visible on npm."
              exit 0
            fi
            sleep 10
          done
          echo "Bootstrap package was accepted but is not visible after 5 minutes" >&2
          exit 1
